name: Deploy

# Every push to main typechecks, runs the navigation tests and builds. If
# Cloudflare credentials are configured it then ships the Worker; if they are
# not, it says so and finishes green rather than failing on setup you have
# simply not done yet.
#
# The SPA and the API deploy as one Worker, so there is never a window where a
# new frontend is talking to an old API.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck both projects
        run: npm run typecheck

      - name: Spatial navigation tests
        run: npm run test:focus

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    # Never deploy from a pull request, and never from a fork, where the
    # Cloudflare secrets do not exist.
    if: github.event_name != 'pull_request' && github.repository == 'BestWaveRock/hearth-tv'
    steps:
      - uses: actions/checkout@v4

      # `secrets` cannot be referenced in a job-level `if`, so availability is
      # resolved here and every later step is gated on the result.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment skipped"
              echo
              echo "Hearth built and tested successfully, but it was not deployed because"
              echo "Cloudflare credentials are not configured."
              echo
              echo "To enable automatic deployment, add two repository secrets under"
              echo "**Settings → Secrets and variables → Actions**:"
              echo
              echo "| Secret | Where to get it |"
              echo "| --- | --- |"
              echo "| \`CLOUDFLARE_API_TOKEN\` | An API token with *Edit Cloudflare Workers* and *D1 Edit* |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | The Account ID in your Cloudflare dashboard sidebar |"
              echo
              echo "You also need a D1 database id in \`wrangler.toml\` — run \`npm run db:create\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deployment skipped::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deploys. Build and tests passed."
          fi

      # A placeholder database id produces a confusing API error deep inside
      # wrangler, so it is caught here with an actionable message instead.
      - name: Verify the database is configured
        if: steps.creds.outputs.ready == 'true'
        run: |
          if grep -q 'PLACEHOLDER_RUN_npm_run_db_create' wrangler.toml; then
            echo "::error title=D1 database not created::wrangler.toml still has the placeholder database_id. Run 'npm run db:create' locally and commit the printed database_id."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Build the SPA
        if: steps.creds.outputs.ready == 'true'
        run: npm run build

      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The schema uses IF NOT EXISTS throughout, so re-running it on every
          # deploy is safe and keeps a fresh database in step.
          command: d1 execute hearth-tv --remote --file=./schema.sql

      - name: Deploy Worker and assets
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report the deployment
        if: steps.creds.outputs.ready == 'true'
        run: |
          {
            echo "### Deployed"
            echo
            echo "Worker and static assets are live."
            echo
            echo "If this is the first deploy, set the credential-vault key before signing in:"
            echo
            echo '```'
            echo 'npm run secret:key                     # generates a 32-byte key'
            echo 'npx wrangler secret put ENCRYPTION_KEY # paste it in'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
