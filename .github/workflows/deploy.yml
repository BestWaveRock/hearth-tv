name: Deploy

# Every push to main builds, typechecks, runs the navigation tests, and ships
# the Worker. The SPA and the API are one deploy target, so there is no window
# in which a new frontend is talking to an old API.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck both projects
        run: npm run typecheck

      - name: Spatial navigation tests
        run: npm run test:focus

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    # Skip deployment on forks, where the Cloudflare secrets do not exist.
    if: github.repository_owner != '' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the SPA
        run: npm run build

      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The schema is written with IF NOT EXISTS throughout, so re-running
          # it on every deploy is safe and keeps a fresh database in step.
          command: d1 execute hearth-tv --remote --file=./schema.sql

      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
