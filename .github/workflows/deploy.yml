name: Deploy

# Every push to main typechecks, runs the navigation tests and builds. If
# Cloudflare credentials are configured it then ships the Worker; if they are
# not, it says so and finishes green rather than failing on setup you have
# simply not done yet.
#
# The SPA and the API deploy as one Worker, so there is never a window where a
# new frontend is talking to an old API.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck both projects
        run: npm run typecheck

      - name: Spatial navigation tests
        run: npm run test:focus

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    # Never deploy from a pull request, and never from a fork, where the
    # Cloudflare secrets do not exist.
    if: github.event_name != 'pull_request' && github.repository == 'BestWaveRock/hearth-tv'
    steps:
      - uses: actions/checkout@v4

      # `secrets` cannot be referenced in a job-level `if`, so availability is
      # resolved here and every later step is gated on the result.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment skipped"
              echo
              echo "Hearth built and tested successfully, but it was not deployed because"
              echo "Cloudflare credentials are not configured."
              echo
              echo "To enable automatic deployment, add two repository secrets under"
              echo "**Settings → Secrets and variables → Actions**:"
              echo
              echo "| Secret | Where to get it |"
              echo "| --- | --- |"
              echo "| \`CLOUDFLARE_API_TOKEN\` | A **custom** token with Workers Scripts:Edit, D1:Edit, Workers KV:Edit, Account Settings:Read. The \"Edit Cloudflare Workers\" template does NOT include D1 and will fail. |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | The Account ID in your Cloudflare dashboard sidebar |"
              echo
              echo "You also need a D1 database id in \`wrangler.toml\` — run \`npm run db:create\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deployment skipped::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deploys. Build and tests passed."
          fi

      # A placeholder database id would otherwise fail deep inside wrangler with
      # an opaque API error. Instead the database is found or created, and its id
      # is written into wrangler.toml for this build only — never committed.
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      # Prints the token's actual permission scopes. When a deploy fails on
      # authentication, this is the log that answers why in one glance.
      - name: Show token scopes
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Ensure the D1 database exists
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ci-provision.mjs ensure-db

      - name: Build the SPA
        if: steps.creds.outputs.ready == 'true'
        run: npm run build

      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The schema uses IF NOT EXISTS throughout, so re-running it on every
          # deploy is safe and keeps a fresh database in step.
          command: d1 execute hearth-tv --remote --file=./schema.sql

      - name: Deploy Worker and assets
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Runs after the deploy because `wrangler secret put` needs the Worker to
      # exist. It only ever sets the key when one is absent — regenerating it
      # would make every stored storage credential undecryptable.
      - name: Ensure the credential-vault key exists
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ci-provision.mjs ensure-key

      - name: Report the deployment
        if: steps.creds.outputs.ready == 'true'
        run: |
          {
            echo "### Deployed"
            echo
            echo "The Worker, the static assets, the D1 database and the credential-vault"
            echo "key are all provisioned. Hearth is live."
            echo
            echo "Open the site, press a button on your remote to pass the pairing gate,"
            echo "create an account, then add a data source under **Sources**."
            echo
            echo "Once your account exists, close registration:"
            echo
            echo '```'
            echo 'npx wrangler secret put ALLOW_SIGNUP   # enter: false'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
