<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08060a" />
    <meta
      name="description"
      content="Hearth — a television interface that runs in your browser and is driven by a remote control. Watch and listen from your own WebDAV, Navidrome or OpenList server."

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    />
    <title>Hearth — television, in a browser tab</title>

    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #f7f0e8">
